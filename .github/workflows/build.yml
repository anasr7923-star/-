name: Build Magic Lantern APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      # 1 - تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2 - إعداد Java
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3 - إعداد Flutter
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4 - التأكد من الإصدارات
      - name: Flutter Doctor
        run: |
          flutter --version
          dart --version
          java -version
          flutter doctor -v

      # 5 - تنظيف أي ملفات بناء قديمة
      - name: Clean project
        run: |
          flutter clean
          rm -rf build
          rm -rf .dart_tool

      # 6 - إصلاح/تجهيز Flutter
      - name: Flutter Pub Get
        run: |
          flutter pub get

      # 7 - فحص المشروع
      - name: Flutter Analyze
        run: |
          flutter analyze --no-fatal-infos

      # 8 - اختبار حزم Dart
      - name: Check Dependencies
        run: |
          flutter pub deps

      # 9 - بناء APK
      - name: Build APK
        run: |
          flutter build apk --release

      # 10 - رفع ملف APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-lantern-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
