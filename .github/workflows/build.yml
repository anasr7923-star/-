name: Build Magic Lantern APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Create Independent Clean App
        run: |
          flutter create --org com.magic.lantern --project-name magic_lantern_app clean_build_dir
          
          cat << 'EOF' > clean_build_dir/lib/main.dart
          import 'package:flutter/material.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'الفانوس السحري',
                debugShowCheckedModeBanner: false,
                home: Scaffold(
                  backgroundColor: const Color(0xFFFFFDE7),
                  body: Center(
                    child: Text(
                      'تسجيل الدخول - الفانوس السحري',
                      style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold),
                    ),
                  ),
                ),
              );
            }
          }
          EOF

      - name: Build Android Release APK
        run: |
          cd clean_build_dir
          flutter build apk --release

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: clean_build_dir/build/app/outputs/flutter-apk/app-release.apk
