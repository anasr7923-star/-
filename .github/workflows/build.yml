name: Build Magic Lantern APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find Flutter Project
        id: find_project
        run: |
          echo "Searching for pubspec.yaml..."
          PROJECT_DIR=$(find . -name "pubspec.yaml" -exec dirname {} \; | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found anywhere in the repository!"
            exit 1
          fi
          echo "Found project at: $PROJECT_DIR"
          echo "project_path=$PROJECT_DIR" >> $GITHUB_OUTPUT

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean and Install Dependencies
        run: |
          flutter clean
          flutter pub get
        working-directory: ${{ steps.find_project.outputs.project_path }}

      - name: Build Android Release APK
        run: flutter build apk --release --target-platform android-arm64
        working-directory: ${{ steps.find_project.outputs.project_path }}

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: |
            ${{ steps.find_project.outputs.project_path }}/build/app/outputs/flutter-apk/app-release.apk
            ${{ steps.find_project.outputs.project_path }}/build/app/outputs/apk/release/app-release.apk
