name: Build Magic Lantern APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: |
          flutter clean
          flutter pub get

      - name: Force Upgrade Android SDK Versions
        run: |
          cd android
          # إجبار المشروع سحابياً على استخدام compileSdk 34 و minSdkVersion 21 لتتوافق مع المكاتب
          sed -i 's/compileSdkVersion .*/compileSdkVersion 34/g' app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/g' app/build.gradle || true
          sed -i 's/targetSdkVersion .*/targetSdkVersion 34/g' app/build.gradle || true
          cd ..

      - name: Build Android Release APK
        run: flutter build apk --release --target-platform android-arm64 --target=lib/main.dart

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
