name: Build Magic Lantern APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show Environment
        run: |
          java -version
          flutter --version
          dart --version
          flutter doctor -v

      - name: Find Flutter Project
        run: |
          echo "Searching for pubspec.yaml..."
          find . -name pubspec.yaml -print

      - name: Detect Project Folder
        shell: bash
        run: |
          if [ -f "pubspec.yaml" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          elif [ -f "magic_lantern/pubspec.yaml" ]; then
            echo "PROJECT_DIR=magic_lantern" >> "$GITHUB_ENV"
          else
            echo "ERROR: pubspec.yaml not found"
            exit 1
          fi

      - name: Check Flutter Project
        run: |
          cd "$PROJECT_DIR"
          pwd
          ls -la
          test -f pubspec.yaml

      - name: Flutter Clean
        run: |
          cd "$PROJECT_DIR"
          flutter clean

      - name: Flutter Pub Get
        run: |
          cd "$PROJECT_DIR"
          flutter pub get

      - name: Flutter Analyze
        run: |
          cd "$PROJECT_DIR"
          flutter analyze --no-fatal-infos

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          flutter build apk --release

      - name: Verify APK
        run: |
          cd "$PROJECT_DIR"
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-lantern-release-apk
          path: |
            **/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
