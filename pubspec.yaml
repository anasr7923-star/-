name: magic_lantern
description: "برنامج النقل الذكي والمحافظ الموحدة الفاخر لعام 2026"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 🟢 الحزم السيادية الموحدة والمأمنة تماماً بدون أي تضارب
  google_fonts: ^8.2.1
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^10.1.0
  google_maps_flutter: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true