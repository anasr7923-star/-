name: Build Magic Lantern APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Action
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: false

      - name: Create Independent Clean App
        run: |
          # 1. إنشاء مشروع فلاتر مستقل تماماً ومنعزل عن أي ملفات قديمة
          flutter create --org com.magic.lantern --project-name magic_lantern_app clean_build_dir
          
          # 2. حقن شفرة محرك الاتصال بقاعدة بيانات سيرفر Clever Cloud والمحافظ الرقمية
          cat << 'EOF' > clean_build_dir/lib/network_service.dart
          import 'dart:convert';
          import 'dart:io';
          import 'package:http/http.dart' as http;
          import 'package:http/io_client.dart';

          class NetworkService {
            static const String baseUrl = "https://clever-cloud.com";
            late IOClient _client;

            NetworkService() {
              final HttpClient httpClient = HttpClient()
                ..badCertificateCallback = (X509Certificate cert, String host, int port) => true;
              _client = IOClient(httpClient);
            }

            Future<bool> registerUser({
              required String name,
              required String phone,
              required String email,
              required String password,
              required String role,
            }) async {
              try {
                final response = await _client.post(
                  Uri.parse('$baseUrl/auth/register'),
                  headers: {'Content-Type': 'application/json; charset=UTF-8'},
                  body: jsonEncode({'name': name, 'phone': phone, 'email': email, 'password': password, 'role': role}),
                );
                return response.statusCode == 201 || response.statusCode == 200;
              } catch (e) {
                return false;
              }
            }

            Future<Map<String, dynamic>?> loginUser(String email, String password) async {
              try {
                final response = await _client.post(
                  Uri.parse('$baseUrl/auth/login'),
                  headers: {'Content-Type': 'application/json; charset=UTF-8'},
                  body: jsonEncode({'email': email, 'password': password}),
                );
                if (response.statusCode == 200) {
                  return jsonDecode(response.body) as Map<String, dynamic>;
                }
                return null;
              } catch (e) {
                return null;
              }
            }
          }
          EOF
          
          # 3. حقن المنظومة الكاملة المترابطة (ملف الانطلاق والشاشات المدمجة معاً)
          cat << 'EOF' > clean_build_dir/lib/main.dart
          import 'package:flutter/material.dart';
          import 'network_service.dart';

          void main() => runApp(const MyApp());

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: 'الفانوس السحري',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.amber),
                ),
                home: const LoginScreen(),
              );
            }
          }

          // 🔐 شاشة تسجيل الدخول المركزية بالخانات الكاملة والربط بالسيرفر
          class LoginScreen extends StatefulWidget {
            const LoginScreen({super.key});
            @override
            State<LoginScreen> createState() => _LoginScreenState();
          }

          class _LoginScreenState extends State<LoginScreen> {
            final _emailController = TextEditingController();
            final _passwordController = TextEditingController();
            final _networkService = NetworkService();
            bool _isLoading = false;

            void _handleLogin() async {
              if (_emailController.text.trim().isEmpty || _passwordController.text.trim().isEmpty) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('من فضلك أدخل البريد الإلكتروني وكلمة المرور أولاً!')),
                );
                return;
              }
              setState(() => _isLoading = true);
              final result = await _networkService.loginUser(
                _emailController.text.trim(),
                _passwordController.text.trim(),
              );
              setState(() => _isLoading = false);

              if (result != null) {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('تم تسجيل الدخول بنجاح! جاري فتح لوحة القيادة...')),
                );
                Navigator.pushReplacement(
                  context,
                  MaterialPageRoute(builder: (context) => const AdminDashboard()),
                );
              } else {
                ScaffoldMessenger.of(context).showSnackBar(
                  const SnackBar(content: Text('خطأ في البيانات أو عطل بالاتصال بالسيرفر!')),
                );
              }
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: const Color(0xFFFFFDE7),
                body: SafeArea(
                  child: SingleChildScrollView(
                    child: Padding(
                      padding: const EdgeInsets.all(24.0),
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        crossAxisAlignment: CrossAxisAlignment.stretch,
                        children: [
                          const SizedBox(height: 50),
                          const Icon(Icons.flash_on, size: 80, color: Colors.amber),
                          const SizedBox(height: 20),
                          const Text(
                            'تسجيل الدخول - الفانوس السحري',
                            textAlign: TextAlign.center,
                            style: TextStyle(fontSize: 24, fontWeight: FontWeight.bold, color: Colors.black87),
                          ),
                          const SizedBox(height: 40),
                          TextField(
                            controller: _emailController,
                            decoration: InputDecoration(
                              labelText: 'البريد الإلكتروني / رقم الكابتن',
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                              prefixIcon: const Icon(Icons.email, color: Colors.amber),
                            ),
                          ),
                          const SizedBox(height: 16),
                          TextField(
                            controller: _passwordController,
                            obscureText: true,
                            decoration: InputDecoration(
                              labelText: 'كلمة المرور',
                              border: OutlineInputBorder(borderRadius: BorderRadius.circular(12)),
                              prefixIcon: const Icon(Icons.lock, color: Colors.amber),
                            ),
                          ),
                          const SizedBox(height: 24),
                          _isLoading
                              ? const Center(child: CircularProgressIndicator(color: Colors.amber))
                              : ElevatedButton(
                                  onPressed: _handleLogin,
                                  style: ElevatedButton.styleFrom(
                                    padding: const EdgeInsets.symmetric(vertical: 16),
                                    backgroundColor: Colors.amber,
                                    shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(30)),
                                  ),
                                  child: const Text('دخول الكابتن / الركاب', style: TextStyle(fontSize: 18, color: Colors.black, fontWeight: FontWeight.bold)),
                                ),
                          const SizedBox(height: 20),
                          TextButton(
                            onPressed: () {
                              Navigator.push(
                                context,
                                MaterialPageRoute(builder: (context) => const RegisterScreen()),
                              );
                            },
                            child: const Text(
                              'ليس لديك حساب؟ تسجيل مستخدم جديد',
                              style: TextStyle(color: Color(0xFFFFB300), fontSize: 16, fontWeight: FontWeight.bold, decoration: TextDecoration.underline),
                            ),
                          ),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          // 📝 شاشة تسجيل مستخدم جديد / كابتن فابريكا ومربوطة بالسيرفر
          class RegisterScreen extends StatefulWidget {
            const RegisterScreen({super.key});
            @override
            State<RegisterScreen> createState() => _RegisterScreenState();
          }

          class _RegisterScreenState extends State<RegisterScreen> {
            final _nameController = TextEditingController();
            final _phoneController = TextEditingController();
            final _emailController = TextEditingController();
            final _passwordController = TextEditingController();
            final _networkService = NetworkService();
String _selectedRole = 'driver';
bool _isLoading = false;
void _handleRegister() async {
if (_nameController.text.trim().isEmpty || _phoneController.text.trim().isEmpty || _emailController.text.trim().isEmpty || _passwordController.text.trim().isEmpty) {
ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('من فضلك أكمل كافة البيانات!')));
return;
}
setState(() => _isLoading = true);
final success = await _networkService.registerUser(
name: _nameController.text.trim(),
phone: _phoneController.text.trim(),
email: _emailController.text.trim(),
password: _passwordController.text.trim(),
role: _selectedRole,
);
setState(() => _isLoading = false);
if (success) {
ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('تم تسجيل الحساب بنجاح! يمكنك الدخول الآن.')));
Navigator.pop(context);
} else {
ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('فشل التسجيل! تأكد من البيانات أو عطل الشبكة.')));
}
}
@override
Widget build(BuildContext context) {
return Scaffold(
appBar: AppBar(title: const Text('تسجيل حساب جديد'), backgroundColor: Colors.amber),
body: SafeArea(
child: SingleChildScrollView(
padding: const EdgeInsets.all(24.0),
child: Column(
crossAxisAlignment: CrossAxisAlignment.stretch,
children: [
TextField(controller: _nameController, decoration: const InputDecoration(labelText: 'الاسم الكامل', border: OutlineInputBorder())),
const SizedBox(height: 16),
TextField(controller: _phoneController, keyboardType: TextInputType.phone, decoration: const InputDecoration(labelText: 'رقم الهاتف', border: OutlineInputBorder())),
const SizedBox(height: 16),
TextField(controller: _emailController, keyboardType: TextInputType.emailAddress, decoration: const InputDecoration(labelText: 'البريد الإلكتروني', border: OutlineInputBorder())),
const SizedBox(height: 16),
TextField(controller: _passwordController, obscureText: true, decoration: const InputDecoration(labelText: 'كلمة المرور', border: OutlineInputBorder())),
const SizedBox(height: 16),
DropdownButtonFormField(
value: _selectedRole,
items: const [
DropdownMenuItem(value: 'driver', child: Text('كابتن (سائق)')),
DropdownMenuItem(value: 'passenger', child: Text('راكب')),
],
onChanged: (val) => setState(() => _selectedRole = val!),
decoration: const InputDecoration(border: OutlineInputBorder(), labelText: 'نوع الحساب'),
),
const SizedBox(height: 24),
_isLoading
? const Center(child: CircularProgressIndicator(color: Colors.amber))
: ElevatedButton(
onPressed: _handleRegister,
style: ElevatedButton.styleFrom(padding: const EdgeInsets.symmetric(vertical: 16), backgroundColor: Colors.amber),
child: const Text('إنشاء الحساب وضخ البيانات', style: TextStyle(fontSize: 18, color: Colors.black)),
),
],
),
),
),
);
}
}
// 📊 شاشة لوحة التحكم المركزية ورادار الـ GPS والمحافظ بعد الدخول الناجح
class AdminDashboard extends StatelessWidget {
const AdminDashboard({super.key});
@override
Widget build(BuildContext context) {
return Scaffold(
appBar: AppBar(title: const Text('لوحة قيادة الفانوس السحري'), backgroundColor: Colors.amber),
body: Center(
child: Padding(
padding: const EdgeInsets.all(24.0),
child: Column(
mainAxisAlignment: MainAxisAlignment.center,
children: [
const Icon(Icons.map, size: 100, color: Colors.amber),
const SizedBox(height: 20),
const Text('رادار الـ GPS والخرائط الحية نشط الآن', style: TextStyle(fontSize: 22, fontWeight: FontWeight.bold)),
const SizedBox(height: 10),
Text('تم ربط محفظتك السحابية لايف بسيرفر Clever Cloud', style: TextStyle(fontSize: 16, color: Colors.grey.shade700), textAlign: TextAlign.center),
const SizedBox(height: 30),
ElevatedButton.icon(
onPressed: () {
ScaffoldMessenger.of(context).showSnackBar(const SnackBar(content: Text('جاري قراءة وتحديث رصيد المحفظة بالثانية...')));
},
icon: const Icon(Icons.account_balance_wallet, color: Colors.black),
label: const Text('تحديث رصيد المحفظة الرقمية', style: TextStyle(color: Colors.black, fontWeight: FontWeight.bold)),
style: ElevatedButton.styleFrom(backgroundColor: Colors.amber, padding: const EdgeInsets.symmetric(horizontal: 24, vertical: 12)),
)
],
),
),
),
);
}
}
EOF
flutter pub get
- name: Inject Local SDK Properties
run: |
echo "sdk.dir=$ANDROID_SDK_ROOT" > clean_build_dir/android/local.properties
echo "flutter.sdk=$FLUTTER_ROOT" >> clean_build_dir/android/local.properties
- name: Build Android Release APK
run: |
cd clean_build_dir
flutter build apk --release
- name: Upload Finished APK
uses: actions/upload-artifact@v4
with:
name: app-release
path: clean_build_dir/build/app/outputs/flutter-apk/app-release.apk
